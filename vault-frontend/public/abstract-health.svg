<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b353f"/>
      <stop offset=".48" stop-color="#07131b"/>
      <stop offset="1" stop-color="#02070b"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c2eef0" stop-opacity=".9"/>
      <stop offset=".34" stop-color="#39787d" stop-opacity=".92"/>
      <stop offset=".72" stop-color="#091821" stop-opacity=".98"/>
      <stop offset="1" stop-color="#b5dfe0" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="glow">
