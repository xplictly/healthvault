      <stop offset=".4" stop-color="#4c9da2" stop-opacity=".15"/>
      <stop offset="1" stop-color="#061016" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
